<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="计划">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="55%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F7FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#003A99" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- rounded tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M20 28c8-10 28-16 48-14 18 2 34 10 42 22" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round"/>
  <!-- calendar card -->
  <g filter="url(#sh)">
    <rect x="28" y="34" width="72" height="64" rx="14" fill="url(#card)"/>
    <rect x="28" y="34" width="72" height="18" rx="14" fill="#E8F1FF"/>
    <rect x="28" y="44" width="72" height="8" fill="#E8F1FF"/>
    <circle cx="46" cy="43" r="3.2" fill="#007AFF"/>
    <circle cx="82" cy="43" r="3.2" fill="#007AFF"/>
    <!-- checklist lines -->
    <rect x="40" y="62" width="28" height="5" rx="2.5" fill="#C7C7CC"/>
    <rect x="40" y="74" width="36" height="5" rx="2.5" fill="#C7C7CC"/>
    <rect x="40" y="86" width="22" height="5" rx="2.5" fill="#C7C7CC"/>
  </g>
  <!-- countdown ring + check -->
  <circle cx="86" cy="86" r="22" fill="#FFFFFF" filter="url(#sh)"/>
  <circle cx="86" cy="86" r="16" fill="none" stroke="#E5E5EA" stroke-width="5"/>
  <circle cx="86" cy="86" r="16" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"
    stroke-dasharray="70 100" transform="rotate(-90 86 86)"/>
  <path d="M78 86.5 84 92.5 95 80" fill="none" stroke="#34C759" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
